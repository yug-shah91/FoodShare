# Used when you start the backend with:  --spring.profiles.active=prod
# It switches off everything that is only meant for local development.

# ---------- Production database (MySQL) ----------
# Set these 3 environment variables. Example:
#   DB_URL=jdbc:mysql://localhost:3306/foodshare_prod
#   DB_USERNAME=foodshare_user
#   DB_PASSWORD=your-strong-password
# Use a NEW database for production. Do not reuse your development database (it may contain demo users).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# The database structure is created and changed ONLY by Flyway migration files
# (src/main/resources/db/migration). Hibernate just checks at start-up that the tables match the
# entity classes ("validate") and refuses to start if they do not. It never changes the schema itself.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

spring.h2.console.enabled=false

# No default here: the app will refuse to start unless JWT_SECRET is set.
app.jwt.secret=${JWT_SECRET}

# No default on purpose: the app refuses to start unless CORS_ORIGIN is set, e.g. https://foodshare.example.com
# (the main application.properties would otherwise silently fall back to http://localhost:5173)
app.cors.allowed-origin=${CORS_ORIGIN}

# If the backend runs behind a reverse proxy / load balancer (nginx, Render, Railway, ...), this makes
# request.getRemoteAddr() the real visitor IP taken from X-Forwarded-For, which the login rate limiter needs.
# Tomcat only trusts that header when the request comes from a private-network proxy address, so a visitor
# cannot fake it. Without this line every visitor would look like the proxy and share one IP limit.
server.forward-headers-strategy=native
