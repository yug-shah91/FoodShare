server.port=8080


# ---------- Database (MySQL) ----------
spring.datasource.url=jdbc:mysql://localhost:3306/food_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=123456
# Development only: Hibernate creates/updates the tables itself. (The "prod" profile uses Flyway migrations instead.)
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false


# ---------- JWT (login token) ----------
# Reads the environment variable JWT_SECRET. If it is not set, a development-only value is used.
# NEVER deploy with the default: set your own long random JWT_SECRET (see README).
app.jwt.secret=${JWT_SECRET:dev-only-secret-do-not-use-in-production-0123456789}
app.jwt.expiration-ms=86400000

# ---------- Frontend address allowed to call this API ----------
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:5173}

# Never show internal error text. Our own messages are sent by GlobalExceptionHandler.
server.error.include-message=never

# ---------- Registration throttling (see README, "Registration protection") ----------
# Max registration attempts per IP address in any rolling hour. Raise it if many real people share one IP.
app.rate-limit.register-per-ip-per-hour=10
# A warning is logged when this many accounts were created (by all IPs together) within one hour.
app.rate-limit.register-alert-per-hour=100
